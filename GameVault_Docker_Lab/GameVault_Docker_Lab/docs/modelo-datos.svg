<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#12392b" flood-opacity=".13"/></filter>
    <style>.title{font:700 44px Arial;fill:#171c30}.sub{font:22px Arial;fill:#68708f}.head{font:700 30px Arial;fill:#fff}.field{font:20px 'Courier New';fill:#273d34}.type{font:17px Arial;fill:#688075}.note{font:19px Arial;fill:#465b51}.key{fill:#22d3ee;font:700 16px Arial}</style>
  </defs>
  <rect width="1500" height="900" fill="#f7f7ff"/>
  <text x="750" y="75" text-anchor="middle" class="title">Modelo de datos de GameVault</text>
  <text x="750" y="112" text-anchor="middle" class="sub">PostgreSQL conserva videojuegos; Redis administra interacciones temporales</text>
  <g filter="url(#shadow)">
    <rect x="105" y="175" width="760" height="640" rx="28" fill="#fff" stroke="#ddd6fe" stroke-width="3"/>
    <path d="M105 203 Q105 175 133 175 H837 Q865 175 865 203 V260 H105 Z" fill="#171c30"/>
    <text x="155" y="229" class="head">games</text>
    <text x="720" y="226" class="key">POSTGRESQL</text>
    <g>
      <text x="155" y="310" class="field">id</text><text x="520" y="310" class="type">SERIAL · PRIMARY KEY</text>
      <text x="155" y="355" class="field">title</text><text x="520" y="355" class="type">VARCHAR(120) · NOT NULL</text>
      <text x="155" y="400" class="field">description</text><text x="520" y="400" class="type">VARCHAR(700) · NOT NULL</text>
      <text x="155" y="445" class="field">genre</text><text x="520" y="445" class="type">VARCHAR(60) · INDEX</text>
      <text x="155" y="490" class="field">platform</text><text x="520" y="490" class="type">VARCHAR(60)</text>
      <text x="155" y="535" class="field">release_date</text><text x="520" y="535" class="type">DATE · INDEX</text>
      <text x="155" y="580" class="field">price</text><text x="520" y="580" class="type">NUMERIC(10,2) · CHECK 0..1000</text>
      <text x="155" y="625" class="field">stock</text><text x="520" y="625" class="type">INTEGER · CHECK 0..10000</text>
      <text x="155" y="670" class="field">developer</text><text x="520" y="670" class="type">VARCHAR(120)</text>
      <text x="155" y="715" class="field">featured</text><text x="520" y="715" class="type">BOOLEAN · DEFAULT FALSE</text>
      <text x="155" y="760" class="field">created_at / updated_at</text><text x="520" y="760" class="type">TIMESTAMP</text>
    </g>
    <rect x="940" y="225" width="450" height="220" rx="26" fill="#fff0cd" stroke="#e0c278" stroke-width="3"/>
    <text x="995" y="285" font-family="Arial" font-size="30" font-weight="700" fill="#171c30">Redis · visitas</text>
    <text x="995" y="335" class="field">gamevault:visits</text>
    <text x="995" y="375" class="type">INTEGER temporal</text>
    <text x="995" y="413" class="note">Se incrementa al abrir la aplicación.</text>
    <rect x="940" y="500" width="450" height="250" rx="26" fill="#e3f1e9" stroke="#acd0bc" stroke-width="3"/>
    <text x="995" y="560" font-family="Arial" font-size="30" font-weight="700" fill="#171c30">Redis · favoritos</text>
    <text x="995" y="610" class="field">game:&lt;id&gt;:favorites</text>
    <text x="995" y="650" class="type">SET de identificadores de navegador</text>
    <text x="995" y="692" class="note">Permite agregar o retirar favoritos.</text>
    <text x="995" y="724" class="note">Se borra al reiniciar Redis.</text>
  </g>
</svg>

