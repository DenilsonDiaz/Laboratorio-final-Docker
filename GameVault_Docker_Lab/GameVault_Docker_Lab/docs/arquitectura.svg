<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#12392b" flood-opacity=".14"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#7c3aed"/></marker>
    <style>
      .title{font:700 44px Arial;fill:#171c30}.sub{font:22px Arial;fill:#68708f}.box{fill:#fff;stroke:#ddd6fe;stroke-width:3}.name{font:700 27px Arial;fill:#252047}.desc{font:19px Arial;fill:#6b7280}.small{font:700 17px Arial;fill:#7c3aed}.line{stroke:#7c3aed;stroke-width:5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1500" height="900" fill="#f7f7ff"/>
  <text x="750" y="75" text-anchor="middle" class="title">Arquitectura de GameVault</text>
  <text x="750" y="112" text-anchor="middle" class="sub">Cinco servicios comunicados por la red interna gamevault_internal</text>
  <g filter="url(#shadow)">
    <rect x="575" y="150" width="350" height="120" rx="24" class="box"/>
    <text x="750" y="197" text-anchor="middle" class="name">Navegador</text>
    <text x="750" y="232" text-anchor="middle" class="desc">http://localhost:8080</text>
    <rect x="575" y="340" width="350" height="150" rx="24" fill="#171c30"/>
    <text x="750" y="392" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#fff">NGINX</text>
    <text x="750" y="429" text-anchor="middle" font-family="Arial" font-size="19" fill="#ddd6fe">Frontend + proxy inverso</text>
    <text x="750" y="459" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#22d3ee">ÚNICO PUERTO PUBLICADO</text>
    <rect x="125" y="585" width="360" height="145" rx="24" class="box"/>
    <text x="305" y="635" text-anchor="middle" class="name">catalog-api</text>
    <text x="305" y="671" text-anchor="middle" class="desc">CRUD y reglas de negocio</text>
    <text x="305" y="702" text-anchor="middle" class="small">Flask · Puerto interno 5000</text>
    <rect x="1015" y="585" width="360" height="145" rx="24" class="box"/>
    <text x="1195" y="635" text-anchor="middle" class="name">interactions-api</text>
    <text x="1195" y="671" text-anchor="middle" class="desc">Visitas y favoritos</text>
    <text x="1195" y="702" text-anchor="middle" class="small">Flask · Puerto interno 5001</text>
    <rect x="125" y="785" width="360" height="90" rx="22" fill="#dfeee6" stroke="#a9caba" stroke-width="3"/>
    <text x="305" y="824" text-anchor="middle" class="name">db · PostgreSQL</text>
    <text x="305" y="852" text-anchor="middle" class="desc">Volumen nombrado persistente</text>
    <rect x="1015" y="785" width="360" height="90" rx="22" fill="#fff0cd" stroke="#e0c278" stroke-width="3"/>
    <text x="1195" y="824" text-anchor="middle" class="name">cache · Redis</text>
    <text x="1195" y="852" text-anchor="middle" class="desc">Datos temporales sin RDB/AOF</text>
  </g>
  <path d="M750 270 L750 330" class="line"/>
  <path d="M645 490 C560 535 455 550 370 580" class="line"/>
  <path d="M855 490 C940 535 1045 550 1130 580" class="line"/>
  <path d="M305 730 L305 775" class="line"/>
  <path d="M1195 730 L1195 775" class="line"/>
  <text x="485" y="532" class="small">/api/catalog/</text>
  <text x="903" y="532" class="small">/api/interactions/</text>
</svg>

