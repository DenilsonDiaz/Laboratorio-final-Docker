server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/catalog/ {
        proxy_pass http://catalog-api:${CATALOG_API_PORT}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location /api/interactions/ {
        proxy_pass http://interactions-api:${INTERACTIONS_API_PORT}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 502 503 504 /service-unavailable.html;
    location = /service-unavailable.html {
        internal;
        default_type application/json;
        return 503 '{"error":"Servicio temporalmente no disponible. Intente nuevamente."}';
    }
}
